<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Loom · 像素动画编辑器</title>
<style>
:root{--bg:#11131a;--panel:#191c26;--line:#303545;--text:#edf1ff;--muted:#8d95ad;--accent:#77e1ba;--pink:#ff7aa8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#252a3e,#11131a 42%);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input{font:inherit}button{border:1px solid var(--line);background:#202433;color:var(--text);padding:8px 11px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}.app{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#6a8cff);border-radius:10px;display:grid;place-items:center;color:#10151a;font-weight:800}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}.actions{display:flex;gap:8px}.primary{background:var(--accent);color:#10231e;border-color:var(--accent);font-weight:700}.workspace{display:grid;grid-template-columns:230px minmax(450px,1fr) 250px;gap:16px}.panel{background:rgba(25,28,38,.94);border:1px solid var(--line);border-radius:14px;padding:15px}.panel h3{margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool.active{border-color:var(--pink);color:var(--pink);background:#302333}.symbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}.symbtns button{padding:7px 6px;font-size:12px}.symbtns button.active{border-color:var(--accent);color:var(--accent);background:#122820}.swatches{display:flex;flex-wrap:wrap;gap:9px}.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer}.sw.sel{border-color:white;box-shadow:0 0 0 2px var(--accent)}.range{width:100%;accent-color:var(--accent)}.center{display:flex;flex-direction:column;gap:12px;min-width:0}.canvasbox{background:#0c0e14;border:1px solid var(--line);border-radius:14px;padding:30px;display:grid;place-items:center;min-height:510px;position:relative;overflow:auto}.canvaswrap{position:relative;image-rendering:pixelated;box-shadow:0 0 0 1px #3a4053,0 18px 60px #0008;touch-action:none}.canvaswrap.wrapon{box-shadow:0 0 0 2px var(--accent),0 18px 60px #0008}.canvaswrap:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff11 1px,transparent 1px),linear-gradient(90deg,#ffffff11 1px,transparent 1px);background-size:calc(100% / 16) calc(100% / 16);pointer-events:none;z-index:3}.canvaswrap.nogrid:before{display:none}.canvas{display:block;image-rendering:pixelated;background:#252a3a;touch-action:none}.onion{position:absolute;inset:0;opacity:.23;pointer-events:none;z-index:1}.axis{position:absolute;z-index:2;pointer-events:none}.axis-v{top:0;bottom:0;width:0;border-left:1.5px dashed var(--accent);box-shadow:0 0 6px #77e1ba88}.axis-h{left:0;right:0;height:0;border-top:1.5px dashed var(--accent);box-shadow:0 0 6px #77e1ba88}.grip{position:absolute;z-index:4;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid #10231e;cursor:grab;touch-action:none;box-shadow:0 1px 6px #000a}.grip:active{cursor:grabbing}.grip-v{top:-8px;transform:translateX(-50%)}.grip-h{left:-8px;transform:translateY(-50%)}.wrapbadge{position:absolute;left:8px;bottom:6px;z-index:5;font-size:11px;color:#10231e;background:var(--accent);border-radius:6px;padding:1px 7px;font-weight:700;pointer-events:none}.timeline{display:flex;align-items:center;gap:9px;overflow:auto;padding:4px}.frames{display:flex;gap:8px;overflow:auto}.frame{min-width:70px;height:70px;background:#10131c;border:1px solid var(--line);border-radius:9px;padding:5px;cursor:pointer}.frame.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.frame canvas{width:100%;height:100%;image-rendering:pixelated}.layer{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid transparent;border-radius:8px;cursor:pointer}.layer.active{background:#252a39;border-color:var(--accent)}.layer span{color:var(--muted);font-size:12px}.field{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin:11px 0}.field input[type=text],.field select{width:120px;background:#10131b;border:1px solid var(--line);color:var(--text);padding:7px;border-radius:7px}.hint{color:var(--muted);font-size:12px;line-height:1.5}.status{font-size:12px;color:var(--accent);min-height:18px}.kbd{border:1px solid var(--line);padding:2px 6px;border-radius:5px;color:var(--muted)}@media(max-width:1000px){.workspace{grid-template-columns:190px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}}@media(max-width:700px){.app{padding:14px}.workspace{grid-template-columns:1fr}.left,.right{display:block}.canvasbox{min-height:360px;padding:15px}.actions button span{display:none}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="mark">P</div><div><h1>Pixel Loom</h1><small>帧动画工作台 · 本地项目</small></div></div><div class="actions"><button id="undo" title="撤销 (Ctrl+Z)">↶ <span>撤销</span></button><button id="redo" title="重做 (Ctrl+Shift+Z)">↷ <span>重做</span></button><button id="save" class="primary">保存项目</button><button id="export">导出 PNG</button></div></header>
<section class="workspace"><aside class="panel left"><h3>工具</h3><div class="toolgrid"><button class="tool active" data-tool="pencil">✦ 画笔</button><button class="tool" data-tool="eraser">⌫ 橡皮</button><button class="tool" data-tool="fill">◩ 填充</button><button class="tool" data-tool="picker">◉ 取色</button></div><h3 style="margin-top:22px">对称绘画</h3><div class="symbtns" id="symbtns"><button data-sym="off" class="active">关闭</button><button data-sym="horizontal">▤ 水平轴</button><button data-sym="vertical">▥ 垂直轴</button><button data-sym="quad">✣ 四向</button></div><div class="field" style="margin-top:10px"><label>边缘回卷</label><input id="wrap" type="checkbox"></div><p class="hint">拖动画布边缘的 ● 轴柄移动对称轴，松开立即生效；开启回卷后笔画与填充会环绕到对侧。</p><h3 style="margin-top:18px">颜色</h3><div class="swatches" id="swatches"></div><input id="custom" type="color" value="#ff7aa8" style="width:100%;height:36px;margin-top:12px;background:#10131b;border:1px solid var(--line);border-radius:8px"><h3 style="margin-top:18px">画布</h3><div class="field"><label>缩放</label><input id="zoom" class="range" type="range" min="8" max="28" value="20"></div><div class="field"><label>网格</label><input id="grid" type="checkbox" checked></div></aside>
<section class="center"><div class="canvasbox"><div class="canvaswrap" id="canvaswrap"><canvas id="onion" class="onion" width="16" height="16"></canvas><canvas id="canvas" class="canvas" width="16" height="16"></canvas><div class="axis axis-v" id="axisV"></div><div class="grip grip-v" id="gripV" title="拖动移动垂直对称轴"></div><div class="axis axis-h" id="axisH"></div><div class="grip grip-h" id="gripH" title="拖动移动水平对称轴"></div><div class="wrapbadge" id="wrapbadge" style="display:none">回卷</div></div></div><div class="panel timeline"><button id="addFrame" class="primary">＋ 新建帧</button><button id="duplicate">复制</button><div class="frames" id="frames"></div><label style="margin-left:auto;color:var(--muted);white-space:nowrap">FPS <input id="fps" type="number" min="1" max="24" value="8" style="width:45px;background:#10131b;border:1px solid var(--line);color:white;padding:5px;border-radius:6px"></label></div><div class="status" id="status"></div></section>
<aside class="panel right"><h3>图层</h3><div id="layers"><div class="layer active"><b>主图层</b><span>可见</span></div><div class="layer"><b>阴影</b><span>可见</span></div></div><button id="addLayer" style="width:100%;margin-top:10px">＋ 添加图层</button><h3 style="margin-top:25px">洋葱皮</h3><div class="field"><label>显示前一帧</label><input id="onionToggle" type="checkbox"></div><div class="field"><label>透明度</label><input id="opacity" class="range" type="range" min="5" max="60" value="23"></div><h3 style="margin-top:25px">播放预览</h3><button id="play" class="primary" style="width:100%">▶ 播放动画</button><p class="hint" style="margin-top:10px">项目会自动保存至浏览器本地存储；轴线位置与回卷状态随项目一同保存并可撤销。</p></aside></section></main>
<script src="loom.js"></script>
<script>
(function(){
'use strict';
var N = PixelLoom.DEFAULT_N;
var state = PixelLoom.createState(N);
var store = PixelLoom.createStore(state);

var $ = function (id) { return document.getElementById(id); };
var c = $('canvas'), ctx = c.getContext('2d');
var oc = $('onion'), octx = oc.getContext('2d');
var wrap = $('canvaswrap');

var stroke = null, axisDrag = null, playTimer = null;

/* ---------- rendering ---------- */

function cellRect(i) { return { x: i % N, y: Math.floor(i / N) }; }

function draw() {
  ctx.clearRect(0, 0, N, N);
  ctx.fillStyle = '#202433';
  ctx.fillRect(0, 0, N, N);
  var f = state.frames[state.current];
  for (var i = 0; i < f.length; i++) {
    if (f[i]) { ctx.fillStyle = f[i]; var r = cellRect(i); ctx.fillRect(r.x, r.y, 1, 1); }
  }
  octx.clearRect(0, 0, N, N);
  if ($('onionToggle').checked && state.current > 0) {
    var pf = state.frames[state.current - 1];
    for (var j = 0; j < pf.length; j++) {
      if (pf[j]) { octx.fillStyle = pf[j]; var q = cellRect(j); octx.fillRect(q.x, q.y, 1, 1); }
    }
  }
  renderFrames();
}

function renderFrames() {
  var el = $('frames');
  el.innerHTML = '';
  state.frames.forEach(function (f, i) {
    var b = document.createElement('div');
    b.className = 'frame ' + (i === state.current ? 'active' : '');
    var x = document.createElement('canvas');
    x.width = x.height = N;
    var q = x.getContext('2d');
    q.fillStyle = '#202433';
    q.fillRect(0, 0, N, N);
    f.forEach(function (v, j) {
      if (v) { q.fillStyle = v; var r = cellRect(j); q.fillRect(r.x, r.y, 1, 1); }
    });
    b.appendChild(x);
    b.onclick = function () { stopPlay(); state.current = i; draw(); syncUI(); };
    el.appendChild(b);
  });
}

// Reflect model state into controls/overlay (call after undo/redo/load).
function syncUI() {
  document.querySelectorAll('.tool').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tool === state.tool);
  });
  document.querySelectorAll('#symbtns button').forEach(function (b) {
    b.classList.toggle('active', b.dataset.sym === state.symmetry);
  });
  $('wrap').checked = state.wrap;
  wrap.classList.toggle('wrapon', state.wrap);
  $('wrapbadge').style.display = state.wrap ? 'block' : 'none';
  layoutAxes();
}

// Axis lines + handles in percent of the wrap element (resolution independent).
function layoutAxes() {
  var v = $('axisV'), gv = $('gripV'), h = $('axisH'), gh = $('gripH');
  var pv = state.axisV / N * 100, ph = state.axisH / N * 100;
  var showV = state.symmetry === 'vertical' || state.symmetry === 'quad';
  var showH = state.symmetry === 'horizontal' || state.symmetry === 'quad';
  v.style.display = gv.style.display = showV ? 'block' : 'none';
  h.style.display = gh.style.display = showH ? 'block' : 'none';
  if (showV) { v.style.left = pv + '%'; gv.style.left = pv + '%'; }
  if (showH) { h.style.top = ph + '%'; gh.style.top = ph + '%'; }
}

function applyZoom(z) {
  var px = z * N;
  [c, oc].forEach(function (cv) { cv.style.width = cv.style.height = px + 'px'; });
  wrap.style.width = wrap.style.height = px + 'px';
  layoutAxes();
}

/* ---------- pointer → virtual cell coords ---------- */

function pointerCell(e) {
  var r = c.getBoundingClientRect();
  // Virtual space is NOT folded: wrap mode relies on values outside [0,N)
  // growing continuously so a stroke crossing the seam stays connected.
  return {
    x: (e.clientX - r.left) / r.width * N,
    y: (e.clientY - r.top) / r.height * N
  };
}

function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; $('play').textContent = '▶ 播放动画'; }
}

c.addEventListener('pointerdown', function (e) {
  stopPlay();
  c.setPointerCapture(e.pointerId);
  var p = pointerCell(e);

  if (state.tool === 'picker') {
    var ix = Math.floor(p.x), iy = Math.floor(p.y);
    if (ix >= 0 && ix < N && iy >= 0 && iy < N) {
      var v = state.frames[state.current][iy * N + ix];
      if (v) { state.color = v; $('custom').value = v; flash('已取色 ' + v); }
    }
    return;
  }

  if (state.tool === 'fill') {
    var fillSnap = store.checkpoint();
    var changed = PixelLoom.floodFill(state, Math.floor(p.x), Math.floor(p.y));
    if (changed) store.commit(fillSnap);
    draw();
    return;
  }

  // pencil / eraser: one history entry per gesture, committed only if the
  // gesture actually mutates a pixel. Integer virtual cells (may be outside
  // [0,N) when wrapping); folding to an in-range index happens in planDab.
  pendingSnap = store.checkpoint();
  stroke = PixelLoom.createStroke(store, state.tool);
  if (stroke.move(Math.floor(p.x), Math.floor(p.y))) commitPending();
  draw();
});

c.addEventListener('pointermove', function (e) {
  if (!stroke) return;
  var p = pointerCell(e);
  if (stroke.move(Math.floor(p.x), Math.floor(p.y))) commitPending();
  draw();
});

var pendingSnap = null;
function commitPending() {
  if (pendingSnap) { store.commit(pendingSnap); pendingSnap = null; }
}
function endStroke() {
  pendingSnap = null; // discard checkpoint if the gesture changed nothing
  stroke = null;
}
c.addEventListener('pointerup', endStroke);
c.addEventListener('pointercancel', endStroke);

/* ---------- axis handle dragging (effective immediately) ---------- */

function startAxisDrag(which, e) {
  e.preventDefault();
  e.stopPropagation();
  stopPlay();
  var target = which === 'v' ? $('gripV') : $('gripH');
  target.setPointerCapture(e.pointerId);
  axisDrag = {
    which: which,
    start: which === 'v' ? state.axisV : state.axisH,
    pushed: false
  };
}

function moveAxisDrag(e) {
  if (!axisDrag) return;
  var r = c.getBoundingClientRect();
  var v = axisDrag.which === 'v'
    ? (e.clientX - r.left) / r.width * N
    : (e.clientY - r.top) / r.height * N;
  var snapped = PixelLoom.snapAxis(v, N);
  var key = axisDrag.which === 'v' ? 'axisV' : 'axisH';
  if (!axisDrag.pushed && snapped !== axisDrag.start) {
    // Commit one undo point at the first actual move; pixels + axis travel
    // together in the same history entry.
    store.push();
    axisDrag.pushed = true;
  }
  state[key] = snapped;
  layoutAxes();
  if (axisDrag.pushed) flash(axisDrag.which === 'v' ? '垂直轴 ' + axisLabel(snapped) : '水平轴 ' + axisLabel(snapped));
}

function endAxisDrag() { axisDrag = null; }

function axisLabel(a) {
  return Math.abs(a - Math.round(a)) < 1e-6 ? '边界 ' + a : '第 ' + (Math.floor(a) + 1) + ' 行/列中线';
}

[['gripV', 'v'], ['gripH', 'h']].forEach(function (pair) {
  var g = $(pair[0]);
  g.addEventListener('pointerdown', function (e) { startAxisDrag(pair[1], e); });
  g.addEventListener('pointermove', moveAxisDrag);
  g.addEventListener('pointerup', endAxisDrag);
  g.addEventListener('pointercancel', endAxisDrag);
});

/* ---------- controls ---------- */

document.querySelectorAll('.tool').forEach(function (b) {
  b.onclick = function () {
    state.tool = b.dataset.tool;
    document.querySelectorAll('.tool').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
  };
});

document.querySelectorAll('#symbtns button').forEach(function (b) {
  b.onclick = function () {
    if (b.dataset.sym === state.symmetry) return;
    var snap = store.checkpoint();
    state.symmetry = b.dataset.sym;
    store.commit(snap);
    syncUI();
  };
});

$('wrap').onchange = function (e) {
  if (e.target.checked === state.wrap) return;
  var snap = store.checkpoint();
  state.wrap = e.target.checked;
  store.commit(snap);
  syncUI();
};

var colors = ['#ff7aa8', '#77e1ba', '#ffd166', '#6a8cff', '#b18cff', '#ffffff', '#11131a', '#f97316'];
$('swatches').innerHTML = colors.map(function (x) {
  return '<button class="sw" style="background:' + x + '" data-c="' + x + '"></button>';
}).join('');
document.querySelectorAll('.sw').forEach(function (b) {
  b.onclick = function () { state.color = b.dataset.c; $('custom').value = state.color; };
});
$('custom').oninput = function (e) { state.color = e.target.value; };

$('zoom').oninput = function (e) { applyZoom(+e.target.value); };
$('grid').onchange = function (e) { wrap.classList.toggle('nogrid', !e.target.checked); };
$('opacity').oninput = function (e) { oc.style.opacity = e.target.value / 100; };
$('onionToggle').onchange = draw;

$('addFrame').onclick = function () { stopPlay(); PixelLoom.addFrame(store); draw(); syncUI(); };
$('duplicate').onclick = function () { stopPlay(); PixelLoom.duplicateFrame(store); draw(); syncUI(); };

$('addLayer').onclick = function () {
  var n = document.querySelectorAll('.layer').length + 1;
  var d = document.createElement('div');
  d.className = 'layer';
  d.innerHTML = '<b>图层 ' + n + '</b><span>可见</span>';
  $('layers').appendChild(d);
};

$('undo').onclick = undo;
$('redo').onclick = redo;
function undo() { if (store.undo()) { draw(); syncUI(); } }
function redo() { if (store.redo()) { draw(); syncUI(); } }

document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  }
});

$('fps').onchange = function (e) {
  var v = Math.max(1, Math.min(24, +e.target.value || 8));
  e.target.value = v; state.fps = v;
};

$('save').onclick = function () {
  persist();
  flash('已保存到本地 · ' + new Date().toLocaleTimeString());
};

$('export').onclick = function () {
  // The main canvas IS the export: internal 16×16 resolution, pixels only,
  // no axis/grid overlays — preview and export are the same bitmap.
  var a = document.createElement('a');
  a.download = 'pixel-loom-frame.png';
  a.href = c.toDataURL('image/png');
  a.click();
  flash('已导出当前帧 PNG（' + N + '×' + N + '）');
};

$('play').onclick = function () {
  if (playTimer) { stopPlay(); return; }
  var i = state.current;
  $('play').textContent = '■ 停止预览';
  playTimer = setInterval(function () {
    i = (i + 1) % state.frames.length;
    state.current = i;
    draw(); syncUI();
  }, 1000 / state.fps);
};

/* ---------- persistence (axis + wrap + pixels in one document) ---------- */

var persistTimer = null;
function persist() {
  localStorage.setItem('pixelLoom', PixelLoom.serialize(state));
}
function schedulePersist() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(persist, 400);
}
document.addEventListener('pointerup', schedulePersist);

var statusTimer = null;
function flash(msg) {
  $('status').textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(function () { $('status').textContent = ''; }, 1600);
}

/* ---------- boot: refresh restores pixels, axes and wrap without错位 ---------- */

try {
  var saved = localStorage.getItem('pixelLoom');
  if (saved && PixelLoom.load(state, saved)) {
    store.reset();
    $('fps').value = state.fps;
  }
} catch (e) { /* corrupt payload: keep defaults */ }

state.color = colors[0];
$('custom').value = state.color;
applyZoom(+$('zoom').value);
oc.style.opacity = $('opacity').value / 100;
wrap.classList.toggle('nogrid', !$('grid').checked);
syncUI();
draw();
})();
</script></body></html>
